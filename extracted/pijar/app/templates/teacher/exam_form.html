{% extends 'base.html' %}{% block content %}<div class="form-shell wide"><h1>Buat ujian</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="grid2"><label>Judul<input name="title" required></label><label>Mata pelajaran<input name="subject" required></label><label>Kelas/kelompok<input name="class_group"></label><label>Durasi (menit)<input type="number" min="1" name="duration_minutes" value="60" required></label><label>Jumlah percobaan<input type="number" min="1" name="attempts_allowed" value="1" required></label><label>Mulai (opsional)<input type="datetime-local" name="starts_at"></label><label>Berakhir (opsional)<input type="datetime-local" name="ends_at"></label><label>Nilai minimum<input type="number" min="0" step="0.01" name="passing_score"></label></div><label>Deskripsi<textarea name="description"></textarea></label><div class="checks"><label><input type="checkbox" name="shuffle_questions"> Acak soal</label><label><input type="checkbox" name="shuffle_options"> Acak opsi</label><label><input type="checkbox" name="show_results" checked> Izinkan hasil dilihat siswa</label></div><button class="button">Simpan draft</button></form></div>{% endblock %}
