{% extends 'base.html' %}{% block content %}<div class="form-shell wide"><h1>Buat soal</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Jenis soal<select name="question_type" id="question_type"><option value="MULTIPLE_CHOICE">Pilihan ganda</option><option value="TRUE_FALSE">Benar / Salah</option><option value="SHORT_ANSWER">Jawaban singkat</option><option value="ESSAY">Esai</option></select></label><label>Pertanyaan<textarea name="prompt" required></textarea></label><label>Bobot nilai<input type="number" step="0.01" min="0.01" name="weight" value="1" required></label><div id="options"><p><b>Opsi</b></p>{% for i in range(4) %}<label>Opsi {{i+1}}<input name="option_text"><input type="radio" name="correct_option" value="{{i}}" {% if i==0 %}checked{% endif %}> Benar</label>{% endfor %}</div><label id="reference">Jawaban acuan<textarea name="reference_answer"></textarea></label><label>Penjelasan (opsional)<textarea name="explanation"></textarea></label><button class="button">Simpan soal</button></form></div>{% endblock %}{% block scripts %}<script src="{{url_for('static',filename='js/question.js')}}"></script>{% endblock %}
