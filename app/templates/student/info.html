{% extends 'base.html' %}{% block content %}<div class="form-shell wide"><p class="eyebrow">INFORMASI UJIAN</p><h1>{{exam.title}}</h1><div class="exam-meta"><span>{{exam.subject}}</span><span>{{exam.duration_minutes}} menit</span><span>{{exam.questions|length}} soal</span></div><p>{{exam.description}}</p><form method="post" action="{{url_for('student.start',exam_id=exam.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Nama peserta<input name="participant_name" required></label><label>Identitas peserta<input name="participant_identity" required></label><button class="button">Mulai ujian</button></form></div>{% endblock %}
