{% extends 'base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">MANAJEMEN</p><h1>Ujian</h1></div><a class="button" href="{{url_for('teacher.new_exam')}}">+ Buat ujian</a></div>{% if exams %}<div class="table-wrap"><table><thead><tr><th>Judul</th><th>Status</th><th>Kode</th><th></th></tr></thead><tbody>{% for e in exams %}<tr><td>{{e.title}}<small>{{e.subject}}</small></td><td><span class="badge {{e.status|lower}}">{{e.status}}</span></td><td>{{e.code}}</td><td><a href="{{url_for('teacher.edit_exam',exam_id=e.id)}}">Kelola</a> · <a href="{{url_for('results.exam_results',exam_id=e.id)}}">Hasil</a></td></tr>{% endfor %}</tbody></table></div>{% else %}<div class="empty">Belum ada ujian.</div>{% endif %}{% endblock %}
