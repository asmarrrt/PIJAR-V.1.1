{% extends 'base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">BANK SOAL PRIBADI</p><h1>Bank soal</h1></div><a class="button" href="{{url_for('teacher.new_question')}}">+ Buat soal</a></div>{% if questions %}<div class="table-wrap"><table><thead><tr><th>Pertanyaan</th><th>Jenis</th><th>Bobot</th><th></th></tr></thead><tbody>{% for q in questions %}<tr><td>{{q.prompt}}</td><td>{{q.question_type}}</td><td>{{q.default_weight}}</td><td><form method="post" action="{{url_for('teacher.delete_question',q_id=q.id)}}" class="inline"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="linkbtn danger">Hapus</button></form></td></tr>{% endfor %}</tbody></table></div>{% else %}<div class="empty"><h3>Bank soal masih kosong</h3><a class="button" href="{{url_for('teacher.new_question')}}">Buat soal</a></div>{% endif %}{% endblock %}
